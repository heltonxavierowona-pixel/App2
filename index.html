<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#051E36" />
    <meta name="description" content="NUMERA Import-Export : suivi des commandes, expéditions, documents et coûts de revient." />
    <link rel="icon" type="image/svg+xml" href="/numera-mark.svg" />
    <script>
      // Applique le thème avant le premier affichage, pour éviter un éclair blanc.
      try {
        var t = localStorage.getItem('numera-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>NUMERA Import-Export</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
